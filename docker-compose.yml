version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: epfo_postgres
    environment:
      POSTGRES_DB: epfo_intelligence
      POSTGRES_USER: epfo_admin
      POSTGRES_PASSWORD: epfo_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    command: >
      postgres -c shared_preload_libraries='vector'
               -c max_connections=200
               -c shared_buffers=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epfo_admin -d epfo_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: epfo_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: epfo_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_secure_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: epfo_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://epfo_admin:epfo_secure_password_2026@postgres:5432/epfo_intelligence
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin_secure_2026
      MINIO_BUCKET: epfo-documents
      JWT_SECRET: epfo_prod_secret_key_change_in_env_2026
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: epfo_worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://epfo_admin:epfo_secure_password_2026@postgres:5432/epfo_intelligence
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: epfo_beat
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://epfo_admin:epfo_secure_password_2026@postgres:5432/epfo_intelligence
      CELERY_BROKER_URL: redis://redis:6379/1
    command: celery -A ingest.celery_app beat --loglevel=info
    restart: unless-stopped

  review_ui:
    build:
      context: ./review_ui
      dockerfile: Dockerfile
    container_name: epfo_review_ui
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
